name: Terraform Feature Branch Pipeline

on:
  push:
    branches:
      - "feature/**"

jobs:

  # ============================================================
  # STAGE 1 - SECURITY SCAN
  # ============================================================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: environments/prod

    steps:

      # Checkout Code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Setup Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # --------------------------------------------------------
      # TFLINT
      # --------------------------------------------------------
      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4

      - name: Run TFLint
        run: |
          tflint --init
          tflint --recursive

      # --------------------------------------------------------
      # TFSEC
      # --------------------------------------------------------
      - name: Run tfsec
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: environments/prod

      # --------------------------------------------------------
      # CHECKOV
      # --------------------------------------------------------
      - name: Run Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: environments/prod
          framework: terraform

      # --------------------------------------------------------
      # INFRACOST
      # --------------------------------------------------------
      - name: Setup Infracost
  uses: infracost/actions/setup@v3
  with:
    api-key: ${{ secrets.INFRACOST_API_KEY }}

      - name: Run Infracost
        env:
          INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}
        run: |
          infracost breakdown \
            --path . \
            --format table


  # ============================================================
  # STAGE 2 - TERRAFORM PLAN
  # ============================================================
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest

    needs: security-scan

    defaults:
      run:
        working-directory: environments/prod

    steps:

      # Checkout Code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Setup Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # --------------------------------------------------------
      # AZURE LOGIN
      # --------------------------------------------------------
      - name: Azure Login Using Service Principal
        run: |
          az login \
            --service-principal \
            --username "d9bc2374-158d-4c21-8c6a-ce6fa1b4a924" \
            --password "xVF8Q~z.lN6HVQgnOhX1UFSu7LG6u7mSEviWFaM3" \
            --tenant "91695fd6-371b-4c10-8dc9-21e31d347ad6"

          az account set \
            --subscription "b299f192-d573-4040-b542-2aff90a974b5"

      # Verify Azure Login
      - name: Verify Azure Login
        run: az account show --output table

      # --------------------------------------------------------
      # TERRAFORM FORMAT
      # --------------------------------------------------------
      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      # --------------------------------------------------------
      # TERRAFORM INIT
      # --------------------------------------------------------
      - name: Terraform Init
        run: terraform init -input=false

      # --------------------------------------------------------
      # TERRAFORM VALIDATE
      # --------------------------------------------------------
      - name: Terraform Validate
        run: terraform validate

      # --------------------------------------------------------
      # TERRAFORM PLAN
      # --------------------------------------------------------
      - name: Terraform Plan
        run: terraform plan -input=false -no-color